<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="clinicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="clinicShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#clinicGrad)" filter="url(#clinicShadow)"/>

  <!-- Subtle Inner Border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Clinical Cross (White) -->
  <path d="M 216 110 L 296 110 L 296 216 L 402 216 L 402 296 L 296 296 L 296 402 L 216 402 L 216 296 L 110 296 L 110 216 L 216 216 Z" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Stylized Pet Paw in Center (Emerald Accent) -->
  <!-- Center Main Pad -->
  <ellipse cx="256" cy="275" rx="34" ry="26" fill="#047857"/>
  <!-- Toes -->
  <circle cx="218" cy="235" r="14" fill="#047857"/>
  <circle cx="245" cy="220" r="14" fill="#047857"/>
  <circle cx="267" cy="220" r="14" fill="#047857"/>
  <circle cx="294" cy="235" r="14" fill="#047857"/>
</svg>
