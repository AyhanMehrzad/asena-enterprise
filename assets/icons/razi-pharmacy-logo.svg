<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="raziBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="raziGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#raziBg)"/>
  
  <!-- Green Medical Cross -->
  <path d="M84 38 H116 V76 H154 V108 H116 V146 H84 V108 H46 V76 H84 Z" fill="url(#raziGreen)" opacity="0.25"/>
  
  <!-- Mortar and Pestle / Pharmacy Symbol -->
