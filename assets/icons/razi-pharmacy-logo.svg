  <!-- Capsule Pill Top Right -->
  <g transform="translate(142, 60) rotate(45)">
    <rect x="-8" y="-18" width="16" height="18" rx="8" fill="#ef4444"/>
    <rect x="-8" y="0" width="16" height="18" rx="8" fill="#ffffff"/>
