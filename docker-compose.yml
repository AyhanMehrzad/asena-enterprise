version: '3.8'

services:
  # 1. PHP 8.2 Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asena_enterprise_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_NAME: petshop_db
      DB_USER: asena_user
      DB_PASS: asena_secret_password
      REDIS_HOST: redis
    volumes:
      - ./:/var/www/html
      - uploads_data:/var/www/html/uploads
    networks:
      - asena_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 2. Nginx Web Server Container
  web:
    image: nginx:1.25-alpine
    container_name: asena_enterprise_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - asena_network
    depends_on:
      - app

  # 3. MariaDB Database Container
  db:
    image: mariadb:10.11
    container_name: asena_enterprise_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: petshop_db
      MYSQL_USER: asena_user
      MYSQL_PASSWORD: asena_secret_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - asena_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Redis In-Memory Cache & Rate Limiter Container
  redis:
    image: redis:7-alpine
    container_name: asena_enterprise_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - asena_network

networks:
  asena_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
